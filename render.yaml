services:
  - type: web
    name: email-scheduler-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: email-scheduler-worker
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 3

databases:
  - name: email-scheduler-db
    databaseName: email_scheduler
    user: postgres
